<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STANAG 4609 Reference Player</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; background: #091018; color: #dbe8f4; font-size: 13px; }
    header { padding: 14px 20px; border-bottom: 1px solid #263849; color: #8ed8ff; font-size: 14px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(420px, 36vw, 560px); gap: 16px; padding: 16px; }
    .media-column { min-width: 0; align-self: start; }
    .video-shell { position: relative; align-self: start; line-height: 0; }
    video { display: block; width: 100%; max-height: calc(100vh - 205px); background: black; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    aside { max-height: calc(100vh - 90px); overflow: auto; border: 1px solid #263849; border-radius: 8px; }
    .timeline-shell { position: relative; margin-top: 10px; padding: 9px 10px 8px; border: 1px solid #263849; border-radius: 8px; background: #0b1721; line-height: 1.3; }
    .timeline-heading, .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 5px; color: #a8bed0; font-size: 11px; font-weight: 600; }
    #detection-timeline { display: block; width: 100%; height: 82px; cursor: crosshair; border-radius: 4px; background: #071018; touch-action: none; }
    #timeline-legend { display: flex; min-height: 15px; flex-wrap: wrap; gap: 3px 12px; margin: 5px 1px 1px; color: #8da7ba; font-size: 10px; }
    .timeline-legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .timeline-swatch { width: 7px; height: 7px; border-radius: 2px; }
    #detection-scrubber { display: block; width: 100%; height: 18px; margin: 3px 0 0; accent-color: #62e6a7; }
    #timeline-tooltip { position: absolute; z-index: 8; max-width: min(360px, 80%); padding: 6px 8px; border: 1px solid #3a576d; border-radius: 4px; background: #07131cf2; color: #e2f2ff; font-size: 10px; line-height: 1.45; pointer-events: none; }
    .map-shell { position: relative; height: 300px; border-bottom: 1px solid #263849; background: #07131c; overflow: hidden; touch-action: none; }
    #map { width: 100%; height: 100%; display: block; }
    #map-caption { position: absolute; left: 8px; bottom: 6px; max-width: 65%; padding: 3px 5px; background: #07131cdd; color: #a9c0d2; font-size: 10px; }
    #map-attribution { position: absolute; right: 5px; bottom: 4px; padding: 2px 4px; background: #f4f7f0d9; color: #25323a; font: 10px/1.2 system-ui, sans-serif; }
    #map-attribution a { color: #184a70; }
    .map-controls { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
    .map-controls button { min-width: 28px; padding: 5px 7px; border: 1px solid #49657a; border-radius: 4px; background: #0b1b27e8; color: #dbe8f4; cursor: pointer; }
    .map-controls button:hover, .map-controls button:focus-visible { background: #173044; outline: 1px solid #8ed8ff; }
    #activity { padding: 10px 12px 12px; border-bottom: 1px solid #263849; background: #0b151f; }
    #activity-count { color: #6f899d; font-weight: 400; }
    #activity-list { display: grid; gap: 5px; max-height: 190px; margin: 0; padding: 0; overflow: auto; list-style: none; }
    .activity-item { width: 100%; padding: 7px 8px; border: 1px solid #1d3445; border-radius: 5px; background: #0e1d28; color: #dbe8f4; text-align: left; cursor: pointer; }
    .activity-item:hover, .activity-item:focus-visible { border-color: #4d7d9e; background: #132938; outline: none; }
    .activity-primary { display: flex; justify-content: space-between; gap: 8px; color: #91efb9; }
    .activity-secondary { margin-top: 3px; color: #7894aa; font-size: 10px; }
    .empty-state { margin: 0; color: #6f899d; font-size: 11px; }
    #status { padding: 12px; position: sticky; top: 0; background: #101c28; color: #7ee2a8; line-height: 1.4; }
    #status.error { color: #ff9aab; }
    #diagnostics { margin: 0; padding: 10px 12px; border-top: 1px solid #69414a; border-bottom: 1px solid #69414a; background: #2a1820; color: #ffd4dc; }
    #diagnostics h2 { margin: 0 0 6px; color: #ff9aab; font-size: 12px; font-weight: 600; }
    #issue-list { margin: 0; padding-left: 20px; line-height: 1.45; }
    dl { margin: 0; padding: 8px 12px 16px; }
    .field { display: grid; grid-template-columns: minmax(9rem, .75fr) minmax(0, 1.25fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid #1c2b38; }
    dt { color: #90a8bc; overflow-wrap: break-word; }
    dd { margin: 0; text-align: right; overflow-wrap: anywhere; word-break: normal; }
    .unit { display: inline-block; color: #6d879b; margin-left: 6px; white-space: nowrap; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; }
      video { max-height: 50vh; }
      aside { max-height: 45vh; }
    }
    @media (max-width: 520px) {
      header { padding-inline: 12px; }
      main { gap: 12px; padding: 12px; }
      .field { grid-template-columns: 1fr; gap: 4px; }
      dd { text-align: left; }
    }
  </style>
</head>
<body>
  <header>STANAG 4609 / MISB synchronized reference player</header>
  <main>
    <div class="media-column">
      <div class="video-shell">
        <video id="video" controls autoplay></video>
        <canvas id="overlay" aria-label="VMTI detection overlay"></canvas>
      </div>
      <section class="timeline-shell" aria-labelledby="timeline-title">
        <h2 class="timeline-heading" id="timeline-title"><span>Detection timeline</span><span id="timeline-summary">Waiting for metadata</span></h2>
        <canvas id="detection-timeline" tabindex="0" aria-label="Detection timeline grouped by time and class; click or drag to seek, or use arrow keys"></canvas>
        <div id="timeline-legend" aria-label="Detection class legend"></div>
        <input id="detection-scrubber" type="range" min="0" max="0" step="0.001" value="0" aria-label="Video and detection timeline position">
        <output id="timeline-tooltip" role="tooltip" hidden></output>
      </section>
    </div>
    <aside>
      <div class="map-shell">
        <canvas id="map" aria-label="Interactive geospatial map with current FMV footprint and detections"></canvas>
        <div class="map-controls" aria-label="Map controls"><button id="map-zoom-in" type="button" aria-label="Zoom map in">+</button><button id="map-zoom-out" type="button" aria-label="Zoom map out">−</button><button id="map-follow" type="button" aria-label="Follow current frame">Follow</button></div>
        <div id="map-caption">Waiting for geospatial metadata…</div>
        <div id="map-attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
      </div>
      <section id="activity" aria-labelledby="activity-title">
        <h2 class="section-heading" id="activity-title"><span>AI detection activity</span><span id="activity-count">0 observations</span></h2>
        <ol id="activity-list"><li class="empty-state">No detections at this time</li></ol>
      </section>
      <div id="status" role="status" aria-live="polite">Loading metadata…</div>
      <section id="diagnostics" aria-live="polite" hidden>
        <h2>Metadata diagnostics</h2>
        <ul id="issue-list"></ul>
      </section>
      <dl id="fields"></dl>
    </aside>
  </main>
  <script>
    const video = document.querySelector('#video');
    const overlay = document.querySelector('#overlay');
    const context = overlay.getContext('2d');
    const status = document.querySelector('#status');
    const panel = document.querySelector('#fields');
    const diagnostics = document.querySelector('#diagnostics');
    const issueList = document.querySelector('#issue-list');
    const map = document.querySelector('#map');
    const mapContext = map.getContext('2d');
    const mapCaption = document.querySelector('#map-caption');
    const timelineCanvas = document.querySelector('#detection-timeline');
    const timelineContext = timelineCanvas.getContext('2d');
    const timelineScrubber = document.querySelector('#detection-scrubber');
    const timelineTooltip = document.querySelector('#timeline-tooltip');
    const timelineSummary = document.querySelector('#timeline-summary');
    const timelineLegend = document.querySelector('#timeline-legend');
    const activityList = document.querySelector('#activity-list');
    const activityCount = document.querySelector('#activity-count');
    const numberFormat = new Intl.NumberFormat('en-US', { maximumFractionDigits: 6, useGrouping: false });
    const query = new URLSearchParams(window.location.search);
    const liveMode = query.get('live') === '1';
    const streamMode = liveMode || query.get('metadata') === 'sse';
    const MAX_STREAM_SAMPLES = 512;
    const MAX_ACTIVITY_ITEMS = 40;
    const MAX_TIMELINE_GROUPS = 5;
    const ACTIVITY_WINDOW_SECONDS = 30;
    const MAX_TILE_CACHE = 96;
    const TILE_TEMPLATE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    const basemapEnabled = query.get('basemap') !== 'off';
    let samples = [], selected = -1, eventStream = null, streamEnded = false;
    let timelineOverview = null, timelineOverviewError = null, timelineOverviewRequestKey = null;
    const TIMELINE_COLORS = ['#62e6a7', '#55bcea', '#ff9f43', '#c792ea', '#ff7185'];
    const TIMELINE_OTHER_COLOR = '#6f899d';
    let timelineBins = [], timelineBinDuration = 0, timelineDirty = true, timelinePointer = null, timelineLabelGroups = [];
    let activeMapSample = null, activeMapIndex = -1;
    const mapView = {longitude: 0, latitude: 0, zoom: 2, follow: true};
    const tileCache = new Map();
    if (!liveMode) video.src = 'media.mp4';
    function loadTimeline() {
      fetch('timeline.json').then(response => {
        if (!response.ok) throw new Error(`timeline request returned HTTP ${response.status}`);
        return response.json();
      }).then(data => {
        if (!Array.isArray(data.samples)) throw new Error('timeline does not contain a samples array');
        samples = data.samples;
        samples.forEach(decorateSample);
        invalidateTimeline();
        if (!samples.length) {
          showUnavailable('No ST 0601 metadata samples found', 'No geospatial metadata');
          return;
        }
        render(findSample(video.currentTime));
      }).catch(error => showUnavailable(`Metadata error: ${error.message || error}`, 'Metadata unavailable', true));
    }
    function loadTimelineOverview() {
      if (!streamMode || liveMode || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const duration = video.duration.toFixed(6);
      const requestKey = `2048/${duration}`;
      if (requestKey === timelineOverviewRequestKey) return;
      timelineOverviewRequestKey = requestKey;
      timelineOverviewError = null;
      fetch(`metadata/summary?bins=2048&duration=${encodeURIComponent(duration)}`).then(response => {
        if (!response.ok) throw new Error(`detection summary returned HTTP ${response.status}`);
        return response.json();
      }).then(data => {
        if (!Number.isInteger(data.bin_count) || data.bin_count < 1 || data.bin_count > 2048 || !Array.isArray(data.bins)) throw new Error('detection summary has an invalid bin contract');
        if (!Number.isFinite(data.duration_seconds) || !Number.isInteger(data.observation_count) || data.observation_count < 0) throw new Error('detection summary has invalid totals');
        timelineOverview = data;
        invalidateTimeline();
      }).catch(error => {
        timelineOverview = null;
        timelineOverviewError = error.message || String(error);
        timelineOverviewRequestKey = null;
        invalidateTimeline();
      });
    }
    function stopMetadataStream() {
      if (eventStream) eventStream.close();
      eventStream = null;
    }
    function startMetadataStream({ restart = false } = {}) {
      if (!streamMode || (eventStream && !restart)) return;
      stopMetadataStream();
      streamEnded = false;
      if (!liveMode) {
        selected = -1;
        samples = [];
      }
      const start = Math.max(0, Number(video.currentTime) || 0);
      const rate = Math.min(16, Math.max(0.1, Number(video.playbackRate) || 1));
      status.classList.remove('error');
      status.textContent = `Connecting live metadata at t=${start.toFixed(3)}s…`;
      const lastEventId = samples.length ? samples[samples.length - 1]._event_id : -1;
      const endpoint = liveMode
        ? `metadata/live?after=${encodeURIComponent(lastEventId)}`
        : `metadata/events?start=${encodeURIComponent(start.toFixed(6))}&rate=${encodeURIComponent(rate)}`;
      const source = new EventSource(endpoint);
      eventStream = source;
      source.addEventListener('sample', event => {
        if (eventStream !== source) return;
        try {
          const sample = JSON.parse(event.data);
          sample._event_id = Number(event.lastEventId);
          decorateSample(sample);
          samples.push(sample);
          if (samples.length > MAX_STREAM_SAMPLES) {
            const removed = samples.length - MAX_STREAM_SAMPLES;
            samples.splice(0, removed);
            selected = Math.max(-1, selected - removed);
          }
          invalidateTimeline();
          render(findSample(video.currentTime));
          if (!liveMode && video.paused) stopMetadataStream();
        } catch (error) {
          stopMetadataStream();
          showUnavailable(`Metadata stream error: ${error.message || error}`, 'Metadata unavailable', true);
        }
      });
      source.addEventListener('reset', event => {
        if (eventStream !== source) return;
        samples = [];
        selected = -1;
        invalidateTimeline();
        const reset = JSON.parse(event.data);
        status.textContent = `Live metadata history skipped ${reset.dropped} samples; resynchronizing…`;
      });
      source.addEventListener('end', () => {
        if (eventStream !== source) return;
        streamEnded = true;
        stopMetadataStream();
        if (!samples.length) showUnavailable('No ST 0601 metadata samples found', 'No geospatial metadata');
      });
      source.onerror = () => {
        if (eventStream !== source || streamEnded) return;
        if (liveMode) {
          status.textContent = 'Live metadata connection interrupted; reconnecting…';
          return;
        }
        stopMetadataStream();
        showUnavailable('Metadata stream disconnected', 'Metadata unavailable', true);
      };
    }
    if (!streamMode) loadTimeline();
    function waitForEvent(target, name) {
      return new Promise((resolve, reject) => {
        const cleanup = () => { target.removeEventListener(name, done); target.removeEventListener('error', failed); };
        const done = () => { cleanup(); resolve(); };
        const failed = () => { cleanup(); reject(new Error(`${name} failed`)); };
        target.addEventListener(name, done, {once: true});
        target.addEventListener('error', failed, {once: true});
      });
    }
    async function appendMedia(sourceBuffer, bytes) {
      if (sourceBuffer.updating) await waitForEvent(sourceBuffer, 'updateend');
      sourceBuffer.appendBuffer(bytes);
      await waitForEvent(sourceBuffer, 'updateend');
    }
    async function startLiveMedia() {
      if (!('MediaSource' in window)) throw new Error('Media Source Extensions are unavailable');
      const mediaSource = new MediaSource();
      video.src = URL.createObjectURL(mediaSource);
      await waitForEvent(mediaSource, 'sourceopen');
      let initialization;
      while (true) {
        initialization = await fetch('media/init.mp4?wait=10', {cache: 'no-store'});
        if (initialization.status !== 503) break;
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      if (!initialization.ok) throw new Error(`media initialization returned HTTP ${initialization.status}`);
      const mimeType = initialization.headers.get('Content-Type');
      if (!mimeType || !MediaSource.isTypeSupported(mimeType)) throw new Error(`unsupported live media type: ${mimeType || 'missing'}`);
      const sourceBuffer = mediaSource.addSourceBuffer(mimeType);
      await appendMedia(sourceBuffer, await initialization.arrayBuffer());
      let after = Number(initialization.headers.get('X-First-Fragment-ID')) - 1;
      while (mediaSource.readyState === 'open') {
        const response = await fetch(`media/fragment?after=${encodeURIComponent(after)}&wait=10`, {cache: 'no-store'});
        if (response.status === 409) throw new Error('live media history was exceeded; reload to join the current keyframe');
        if (response.status === 204) {
          if (response.headers.get('X-Stream-Error') === 'true') throw new Error('live media transcoder stopped with an error');
          if (response.headers.get('X-Stream-End') === 'true') {
            if (sourceBuffer.updating) await waitForEvent(sourceBuffer, 'updateend');
            mediaSource.endOfStream();
            break;
          }
          continue;
        }
        if (!response.ok) throw new Error(`media fragment returned HTTP ${response.status}`);
        await appendMedia(sourceBuffer, await response.arrayBuffer());
        after = Number(response.headers.get('X-Fragment-ID'));
        if (sourceBuffer.buffered.length) {
          const beginning = sourceBuffer.buffered.start(0);
          const end = sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1);
          if (video.currentTime < beginning) video.currentTime = beginning;
          if (end - beginning > 30 && !sourceBuffer.updating) sourceBuffer.remove(beginning, end - 30);
        }
        if (video.paused) video.play().catch(() => {});
      }
    }
    if (liveMode) {
      startMetadataStream();
      startLiveMedia().catch(error => showUnavailable(`Live media error: ${error.message || error}`, 'Metadata unavailable', true));
    }
    function findSample(time) {
      let lo = 0, hi = samples.length - 1, answer = -1;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (samples[mid].time_seconds <= time) { answer = mid; lo = mid + 1; } else hi = mid - 1; }
      return answer;
    }
    function render(index) {
      if (index < 0 || !samples[index]) {
        showUnavailable(`Waiting for first metadata sample… ${samples.length} samples loaded`, 'Waiting for geospatial metadata…');
        return;
      }
      if (index === selected) return;
      selected = index; const sample = samples[index];
      const detections = sample.detections || [];
      const issues = sample.issues || [];
      status.classList.remove('error');
      const delivery = streamMode ? 'SSE live · ' : '';
      status.textContent = `${delivery}t=${sample.time_seconds.toFixed(3)}s · PID ${sample.pid} · PTS ${sample.pts ?? 'async'} · ${detections.length} targets · ${issues.length} diagnostics`;
      panel.replaceChildren(...Object.entries(sample.fields || {}).map(([name, entry]) => {
        const row = document.createElement('div'); row.className = 'field';
        const dt = document.createElement('dt'); dt.textContent = name;
        const dd = document.createElement('dd');
        dd.textContent = displayValue(entry);
        if (entry.units) { const unit = document.createElement('span'); unit.className = 'unit'; unit.textContent = entry.units; dd.append(unit); }
        row.append(dt, dd); return row;
      }));
      issueList.replaceChildren(...issues.map(message => {
        const item = document.createElement('li'); item.textContent = message; return item;
      }));
      diagnostics.hidden = issues.length === 0;
      drawDetections(sample);
      drawMap(sample);
      renderActivity(index);
      drawTimeline();
    }
    function showUnavailable(message, mapMessage, isError = false) {
      selected = -1;
      status.classList.toggle('error', isError);
      status.textContent = message;
      panel.replaceChildren();
      issueList.replaceChildren();
      diagnostics.hidden = true;
      drawDetections(null);
      drawMap(null);
      renderActivity(-1);
      drawTimeline();
      mapCaption.textContent = mapMessage;
    }
    function displayValue(entry) {
      if (entry.display != null) return entry.display;
      if (typeof entry.value === 'number') return numberFormat.format(entry.value);
      if (typeof entry.value === 'object') return JSON.stringify(entry.value);
      return entry.value ?? '';
    }
    function sampleTimestamp(sample) {
      return sample?.fields?.['UTC Timestamp']?.value ?? sample?.fields?.['Precision Time Stamp']?.value ?? null;
    }
    function detectionLabel(detection) {
      return detection.label || (detection.target_id == null ? 'unlabelled target' : `target ${detection.target_id}`);
    }
    function decorateSample(sample) {
      if (!sample || Array.isArray(sample._activity_groups)) return;
      const groups = new Map();
      for (const detection of sample.detections || []) {
        const label = detectionLabel(detection);
        const key = `${label}\u0000${detection.status || ''}`;
        let group = groups.get(key);
        if (!group) {
          group = {label, status: detection.status || null, count: 0, confidenceTotal: 0, confidenceCount: 0, latitudeTotal: 0, longitudeTotal: 0, haeTotal: 0, located: 0, haeCount: 0, projectedLatitudeTotal: 0, projectedLongitudeTotal: 0, projected: 0, source: detection.location_source || null};
          groups.set(key, group);
        }
        group.count += 1;
        if (Number.isFinite(detection.confidence)) { group.confidenceTotal += detection.confidence; group.confidenceCount += 1; }
        if (Number.isFinite(detection.latitude) && Number.isFinite(detection.longitude)) {
          group.latitudeTotal += detection.latitude; group.longitudeTotal += detection.longitude; group.located += 1;
          if (Number.isFinite(detection.hae)) { group.haeTotal += detection.hae; group.haeCount += 1; }
        } else if (Array.isArray(detection.ground_polygon) && detection.ground_polygon.length >= 4) {
          const corners = detection.ground_polygon.slice(0, 4).filter(point => Array.isArray(point) && point.length >= 2 && point.slice(0, 2).every(Number.isFinite));
          if (corners.length === 4) {
            group.projectedLongitudeTotal += corners.reduce((total, point) => total + point[0], 0) / 4;
            group.projectedLatitudeTotal += corners.reduce((total, point) => total + point[1], 0) / 4;
            group.projected += 1;
          }
        }
      }
      sample._activity_groups = [...groups.values()].map(group => ({
        label: group.label,
        status: group.status,
        count: group.count,
        confidence: group.confidenceCount ? Math.round(group.confidenceTotal / group.confidenceCount) : null,
        latitude: group.located ? group.latitudeTotal / group.located : null,
        longitude: group.located ? group.longitudeTotal / group.located : null,
        hae: group.haeCount ? group.haeTotal / group.haeCount : null,
        located: group.located,
        projectedLatitude: group.projected ? group.projectedLatitudeTotal / group.projected : null,
        projectedLongitude: group.projected ? group.projectedLongitudeTotal / group.projected : null,
        projected: group.projected,
        source: group.source,
      }));
    }
    function renderActivity(index) {
      const rows = [];
      if (index >= 0 && samples[index]) {
        const cutoff = samples[index].time_seconds - ACTIVITY_WINDOW_SECONDS;
        for (let sampleIndex = index; sampleIndex >= 0 && rows.length < MAX_ACTIVITY_ITEMS; sampleIndex -= 1) {
          const sample = samples[sampleIndex];
          if (sample.time_seconds < cutoff) break;
          decorateSample(sample);
          for (const group of sample._activity_groups || []) {
            rows.push({sample, group});
            if (rows.length === MAX_ACTIVITY_ITEMS) break;
          }
        }
      }
      activityCount.textContent = `${rows.reduce((total, row) => total + row.group.count, 0)} observations`;
      if (!rows.length) {
        const empty = document.createElement('li'); empty.className = 'empty-state'; empty.textContent = 'No detections in the last 30 seconds';
        activityList.replaceChildren(empty); return;
      }
      activityList.replaceChildren(...rows.map(({sample, group}) => {
        const item = document.createElement('li');
        const button = document.createElement('button'); button.type = 'button'; button.className = 'activity-item';
        button.dataset.timeSeconds = sample.time_seconds;
        button.addEventListener('click', () => { if (!liveMode) { video.currentTime = sample.time_seconds; render(findSample(video.currentTime)); syncPlayhead(); } });
        const primary = document.createElement('span'); primary.className = 'activity-primary';
        const name = document.createElement('span'); name.textContent = `${group.label}${group.count > 1 ? ` ×${group.count}` : ''}`;
        const confidence = document.createElement('span'); confidence.textContent = group.confidence == null ? 'confidence n/a' : `${group.confidence}%`;
        primary.append(name, confidence);
        const secondary = document.createElement('span'); secondary.className = 'activity-secondary';
        let location = 'image-space only · no resolved ground location';
        if (Number.isFinite(group.latitude) && Number.isFinite(group.longitude)) {
          location = `${group.latitude.toFixed(5)}, ${group.longitude.toFixed(5)}${Number.isFinite(group.hae) ? ` · ${group.hae.toFixed(1)} m HAE` : ''}`;
        } else if (Number.isFinite(group.projectedLatitude) && Number.isFinite(group.projectedLongitude)) {
          location = `≈ ${group.projectedLatitude.toFixed(5)}, ${group.projectedLongitude.toFixed(5)} · footprint interpolation`;
        }
        const absolute = sampleTimestamp(sample);
        secondary.textContent = `${sample.time_seconds.toFixed(3)}s${absolute ? ` · ${absolute}` : ''} · ${location}`;
        button.append(primary, secondary); item.append(button); return item;
      }));
    }

    video.addEventListener('loadedmetadata', () => { loadTimelineOverview(); invalidateTimeline(); if (selected >= 0) drawDetections(samples[selected]); });
    video.addEventListener('durationchange', () => { loadTimelineOverview(); invalidateTimeline(); });
    new ResizeObserver(() => selected >= 0 && drawDetections(samples[selected])).observe(video);
    new ResizeObserver(() => { if (selected >= 0) drawMap(samples[selected], {preserveView: true}); }).observe(map);
    new ResizeObserver(invalidateTimeline).observe(timelineCanvas);
    if (video.readyState >= 1) loadTimelineOverview();
  </script>
</body>
</html>
